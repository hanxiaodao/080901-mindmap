<!--
Exam Note Distiller · 思维导图 HTML 模板（资产）

用法：本模板是"内容 → 页面"的唯一呈现层。把 exam-notes.md（格式见 references/format-contract.md）
的内容渲染进本模板，输出 index.html。交互脚本（折叠/主题/导出）原样保留，不要改动 JS。

═══ Token 替换表 ═══
@@PAGE_TITLE@@    页面 <title>，格式"课程名 · 考点笔记"
@@H1@@            页头大标题 = 课程名
@@STAT_CH@@       章数（数字）
@@STAT_KP@@       考点总数（数字）
@@SUBTITLE_STAT@@ 副标题统计区。有副标题时填：
                  <div class="header-divider"></div><div class="header-stat"><strong>副标题文本</strong></div>
                  无则删除此行占位
@@BODY_CLASS@@    无 GitHub 按钮 → no-github；有 → 空字符串
@@GITHUB@@        GitHub 仓库 URL（不展示按钮时保留占位即可，按钮已被 no-github 隐藏）
@@CHAPTERS@@      所有章节 HTML（生成规则见下）
@@EXPORT_NAME@@   导出 Markdown 文件名，如"数据结构考点笔记.md"

═══ exam-notes.md → HTML 渲染规则 ═══
## 章标题     → <div class="ch" style="--accent:暗色;--accent-light:亮色"> 卡片，章标题放 .ch-title 内，
                考点数徽章：<span class="badge">N考点</span>（0 个考点则省略），折叠箭头 <span class="arrow">▼</span>
章导语内容    → <div class="ch-intro">…</div>（章标题下、考点前）
### 考点N：名 → .kp 行：
                <span class="kp-num">考点N</span><span class="kp-name">名称</span>
                meta: level=S → <span class="kp-level lv-S">S</span>（A/B/C/D 同理，仅 S/A/B/C/D 有样式）
                meta: freq=… → <span class="kp-freq">…</span>
                末尾 <span class="kp-arrow">▼</span>，详情容器 <div class="kp-detail">
#### 子主题   → <span class="kp-sub">标题</span>
普通行        → 转义 HTML 后整行输出，行尾加 <br>；**x** → <b>x</b>；==x== → <span class="em">x</span>
```f 块      → <span class="formula">…（换行保留，多行直接放 
）</span>
```err/tip/ok → <span class="callout err|tip|ok">…</span>
| 表格        → <table><tr><th>表头…</th></tr><tr><td>…</td></tr></table>（单元格内同样处理 **bold**）
- 列表        → <ul><li>…</li></ul>

═══ 章节配色 ═══
按章节顺序取下表（暗色, 亮色），超过 12 章用黄金角扩展 hue=(217+n*137.5)%360：
 1 (#60a5fa,#2563eb)  2 (#34d399,#059669)  3 (#fbbf24,#d97706)  4 (#f472b6,#db2777)
 5 (#a78bfa,#7c3aed)  6 (#22d3ee,#0891b2)  7 (#fb923c,#ea580c)  8 (#a3e635,#65a30d)
 9 (#fb7185,#e11d48) 10 (#4ade80,#16a34a) 11 (#e879f9,#a21caf) 12 (#facc15,#a16207)
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@@PAGE_TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){
  var t;
  try{ t=localStorage.getItem('theme'); }catch(e){}
  if(t!=='light'&&t!=='dark'){ t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --card:#1c2230;
  --border:#2a3344; --border-strong:#3d4f66;
  --text:#c9d2dd; --muted:#7d8fa8; --faint:#4a5568;
  --heading:#e2eaf2;
  --hover-bg:rgba(255,255,255,.03);
  --detail-bg:rgba(0,0,0,.15);
  --formula-bg:#111c2e; --formula-text:#8fb5e8;
  --th-bg:rgba(255,255,255,.05);
  --row-hover-bg:rgba(255,255,255,.02);
  --tip:#fbbf24; --ok:#34d399; --err:#f87171; --em:#fbbf24;
  --focus:#60a5fa;
  --detail-text:var(--muted); --detail-size:13px;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#f3f1ec; --surface:#faf9f5; --card:#faf9f5;
  --border:#e2dfd7; --border-strong:#c9c5ba;
  --text:#33393f; --muted:#626b7a; --faint:#9aa1ab;
  --heading:#242930;
  --hover-bg:rgba(45,45,55,.045);
  --detail-bg:#f5f3ee;
  --formula-bg:#eef2fa; --formula-text:#2c5cb0;
  --th-bg:rgba(45,45,55,.05);
  --row-hover-bg:rgba(45,45,55,.03);
  --tip:#a16207; --ok:#047857; --err:#dc2626; --em:#a16207;
  --focus:#2563eb;
  --detail-text:#4c5868; --detail-size:14px;
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ── Header ── */
header {
  padding:40px 20px 32px;
  text-align:center;
  border-bottom:1px solid var(--border);
  margin-bottom:20px;
}
header h1 {
  font-family:'Noto Serif SC',serif;
  font-size:26px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--heading);
  margin-bottom:10px;
}
.header-meta {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}
.header-stat {
  font-size:12px;
  color:var(--muted);
  letter-spacing:.5px;
}
.header-stat strong {
  font-size:18px;
  font-weight:600;
  color:var(--text);
  display:block;
  font-family:'Noto Sans SC',sans-serif;
  line-height:1.2;
  margin-bottom:2px;
}
.header-divider {
  width:1px; height:28px;
  background:var(--border-strong);
}

/* ── Chapter list ── */
.chapters { padding:0 16px 60px; display:flex; flex-direction:column; gap:8px; max-width:860px; margin:0 auto; }

.ch {
  border-radius:10px;
  overflow:hidden;
  border:1px solid var(--border);
  background:var(--surface);
  transition:border-color .2s;
}
.ch:hover { border-color:var(--border-strong); }

.ch-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px 14px 20px;
  cursor:pointer;
  font-weight:600;
  font-size:15px;
  color:var(--text);
  position:relative;
  transition:background .15s;
}
.ch-title:hover { background:var(--hover-bg); }
.ch-title::before {
  content:'';
  position:absolute;
  left:0; top:0; bottom:0;
  width:3px;
  background:var(--accent);
  transition:width .2s;
}
:root[data-theme="light"] .ch-title::before { background:var(--accent-light, var(--accent)); }
.ch.open .ch-title { background:var(--hover-bg); }
.ch.open .ch-title::before { width:5px; }

.ch-title-text { flex:1; }
.ch-title .badge {
  font-size:11px;
  font-weight:400;
  color:var(--muted);
  margin-left:8px;
  font-family:'Noto Sans SC',sans-serif;
}
.ch-title .arrow {
  font-size:10px;
  color:var(--faint);
  transition:transform .25s;
  flex-shrink:0;
  margin-left:12px;
}
.ch.open .arrow { transform:rotate(180deg); }

.ch-body {
  background:var(--card);
  border-top:1px solid var(--border);
  display:none;
}
.ch.open .ch-body { display:block; }

/* 章导语 */
.ch-intro {
  padding:14px 20px 16px;
  font-size:var(--detail-size);
  color:var(--detail-text);
  line-height:1.75;
  border-bottom:1px solid var(--border);
  background:var(--detail-bg);
}
.ch-intro b { color:var(--text); font-weight:600; }

/* ── 考点 ── */
.kp { border-bottom:1px solid var(--border); }
.kp:last-child { border-bottom:none; }

.kp-title {
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 18px 11px 20px;
  cursor:pointer;
  transition:background .15s;
}
.kp-title:hover { background:var(--hover-bg); }

.kp-num {
  font-size:10px;
  font-weight:600;
  color:var(--accent);
  min-width:36px;
  white-space:nowrap;
  letter-spacing:.3px;
  font-family:'Noto Sans SC',sans-serif;
}
:root[data-theme="light"] .kp-num { color:var(--accent-light, var(--accent)); }
.kp-name {
  flex:1;
  font-size:14px;
  font-weight:500;
  color:var(--text);
}
.kp-level {
  font-size:10px;
  font-weight:700;
  padding:0 8px;
  line-height:18px;
  border-radius:9px;
  flex-shrink:0;
  letter-spacing:.5px;
}
.kp-level.lv-S { color:#f87171; background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.35); }
.kp-level.lv-A { color:#fbbf24; background:rgba(251,191,36,.10); border:1px solid rgba(251,191,36,.32); }
.kp-level.lv-B { color:#60a5fa; background:rgba(96,165,250,.10); border:1px solid rgba(96,165,250,.32); }
.kp-level.lv-C { color:#9ab; background:rgba(153,170,187,.10); border:1px solid rgba(153,170,187,.30); }
.kp-level.lv-D { color:var(--faint); background:rgba(74,85,104,.12); border:1px solid rgba(74,85,104,.30); }
:root[data-theme="light"] .kp-level.lv-S { color:#dc2626; background:rgba(220,38,38,.07); }
:root[data-theme="light"] .kp-level.lv-A { color:#b45309; background:rgba(180,83,9,.07); }
:root[data-theme="light"] .kp-level.lv-B { color:#2563eb; background:rgba(37,99,235,.07); }
.kp-freq {
  font-size:10px;
  color:var(--faint);
  font-weight:400;
  white-space:nowrap;
  flex-shrink:0;
}
.kp-arrow {
  font-size:9px;
  color:var(--faint);
  transition:transform .2s;
  flex-shrink:0;
}
.kp.open .kp-arrow { transform:rotate(180deg); }

.kp-detail {
  display:none;
  padding:14px 20px 18px 68px;
  font-size:var(--detail-size);
  color:var(--detail-text);
  line-height:1.75;
  border-top:1px solid var(--border);
  background:var(--detail-bg);
}
.kp.open .kp-detail { display:block; }
.kp-detail b { color:var(--text); font-weight:600; }

/* 公式块 */
.kp-detail .formula, .ch-intro .formula {
  display:block;
  background:var(--formula-bg);
  border-left:2px solid var(--accent);
  border-radius:0 6px 6px 0;
  padding:8px 14px;
  margin:8px 0;
  font-size:13px;
  color:var(--formula-text);
  letter-spacing:.6px;
  line-height:1.7;
  overflow-x:auto;
  white-space:pre-wrap;
  font-family:'Consolas','Courier New',monospace;
}
:root[data-theme="light"] .kp-detail .formula,
:root[data-theme="light"] .ch-intro .formula { border-left-color:var(--accent-light, var(--accent)); }

/* 语义提示块 */
.callout {
  display:block;
  border-left:2px solid;
  border-radius:0 6px 6px 0;
  padding:8px 14px;
  margin:8px 0;
  font-size:13px;
  line-height:1.7;
  white-space:pre-wrap;
}
.callout.err { color:var(--err); background:rgba(248,113,113,.07); border-color:var(--err); }
.callout.tip { color:var(--tip); background:rgba(251,191,36,.06); border-color:var(--tip); }
.callout.ok  { color:var(--ok);  background:rgba(52,211,153,.07); border-color:var(--ok); }
.callout b { color:inherit; }

/* 表格 */
.kp-detail table, .ch-intro table {
  width:100%;
  border-collapse:collapse;
  margin:10px 0;
  font-size:12px;
}
.kp-detail td, .kp-detail th, .ch-intro td, .ch-intro th {
  border:1px solid var(--border);
  padding:6px 10px;
  text-align:center;
  vertical-align:middle;
}
.kp-detail th, .ch-intro th {
  background:var(--th-bg);
  color:var(--text);
  font-weight:600;
  font-size:11px;
  letter-spacing:.3px;
}
.kp-detail tr:hover td, .ch-intro tr:hover td { background:var(--row-hover-bg); }
.kp-detail ul, .ch-intro ul { padding-left:16px; }
.kp-detail li, .ch-intro li { margin:3px 0; }

/* 子标题 */
.kp-sub {
  display:block;
  color:var(--text);
  font-size:12px;
  font-weight:600;
  margin-top:14px;
  margin-bottom:4px;
  letter-spacing:.3px;
  padding-bottom:4px;
  border-bottom:1px solid var(--border);
}
.kp-sub:first-child { margin-top:2px; }

/* ── 右上角功能按钮 ── */
.theme-toggle, .github-link, .export-md {
  position:fixed;
  top:16px;
  width:38px; height:38px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  transition:border-color .2s, color .2s, transform .15s;
}
.theme-toggle:hover, .github-link:hover, .export-md:hover {
  border-color:var(--border-strong);
  color:var(--text);
  transform:scale(1.06);
}
.theme-toggle { right:64px; }
.github-link { right:16px; }
.export-md { right:112px; }
body.no-github .github-link { display:none; }
body.no-github .theme-toggle { right:16px; }
body.no-github .export-md { right:64px; }
.theme-toggle .icon-sun { display:none; }
:root[data-theme="light"] .theme-toggle .icon-sun { display:block; }
:root[data-theme="light"] .theme-toggle .icon-moon { display:none; }

/* 键盘焦点 */
.ch-title:focus-visible, .kp-title:focus-visible { outline:2px solid var(--focus); outline-offset:-2px; }
.theme-toggle:focus-visible, .github-link:focus-visible, .export-md:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

/* ── 响应式 ── */
@media (max-width:600px) {
  header { padding:52px 16px 24px; }
  header h1 { font-size:21px; }
  .chapters { padding:0 10px 48px; }
  .kp-detail { padding-left:20px; }
  .header-divider { display:none; }
  .theme-toggle, .github-link, .export-md { top:10px; width:36px; height:36px; }
  .theme-toggle { right:52px; }
  .github-link { right:10px; }
  .export-md { right:94px; }
  body.no-github .theme-toggle { right:10px; }
  body.no-github .export-md { right:52px; }
}
@media (prefers-reduced-motion:reduce) {
  .arrow, .kp-arrow, .ch-title::before, .theme-toggle, .github-link, .export-md { transition:none; }
}
</style>
</head>
<body class="@@BODY_CLASS@@">
<button class="export-md" onclick="exportMarkdown()" aria-label="导出为 Markdown 笔记" title="导出为 Markdown 笔记">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
</button>
<button class="theme-toggle" onclick="toggleTheme()" aria-label="切换亮色/暗色模式" title="切换亮色/暗色模式">
  <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<a class="github-link" href="@@GITHUB@@" target="_blank" rel="noopener" aria-label="GitHub 项目源码" title="GitHub 项目源码">
  <svg width="19" height="19" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
</a>
<header>
  <h1>@@H1@@</h1>
  <div class="header-meta">
    <div class="header-stat"><strong>@@STAT_CH@@</strong>章</div>
    <div class="header-divider"></div>
    <div class="header-stat"><strong>@@STAT_KP@@</strong>考点</div>
    @@SUBTITLE_STAT@@
  </div>
</header>
<div class="chapters">
@@CHAPTERS@@

<script>
function toggleTheme(){var r=document.documentElement,next=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',next);try{localStorage.setItem('theme',next)}catch(e){}}
document.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var el=e.target;if(el.classList&&el.classList.contains('ch-title')){e.preventDefault();toggleCh(el)}else if(el.classList&&el.classList.contains('kp-title')){e.preventDefault();toggleKp(el)}});
function toggleCh(el){var ch=el.closest('.ch'),isOpen=ch.classList.contains('open');ch.classList.toggle('open');el.setAttribute('aria-expanded',String(!isOpen));if(!isOpen){ch.querySelectorAll('.kp-detail').forEach(function(d){d.style.display='none'});ch.querySelectorAll('.kp').forEach(function(k){k.classList.remove('open')});ch.querySelectorAll('.kp-title').forEach(function(t){t.setAttribute('aria-expanded','false')})}}
function toggleKp(el){var kp=el.closest('.kp'),isOpen=kp.classList.contains('open');kp.classList.toggle('open');el.setAttribute('aria-expanded',String(!isOpen));kp.querySelector('.kp-detail').style.display=isOpen?'none':'block'}
function mdInline(n){if(n.nodeType===3)return n.textContent;if(n.nodeType!==1)return '';if(n.tagName==='BR')return '\n';var s='';for(var i=0;i<n.childNodes.length;i++)s+=mdInline(n.childNodes[i]);var t=n.tagName;if(t==='B'||t==='STRONG')return '**'+s.trim()+'**';return s}
function mdTable(t){var rows=[].map.call(t.rows,function(r){return [].map.call(r.cells,function(c){return mdInline(c).trim().replace(/\|/g,'\\|').replace(/\n/g,' ')})});if(!rows.length)return '';function line(cs){return '| '+cs.join(' | ')+' |'}var out=[line(rows[0]),line(rows[0].map(function(){return '---'}))];for(var i=1;i<rows.length;i++)out.push(line(rows[i]));return out.join('\n')}
function mdDetail(el){var lines=[],cur='';function flush(){cur=cur.trim();if(cur)lines.push(cur);cur=''}[].forEach.call(el.childNodes,function(n){if(n.nodeType===3){cur+=n.textContent.replace(/\s+/g,' ');return}if(n.nodeType!==1)return;var tag=n.tagName;if(tag==='svg'){return}if(tag==='BR'){flush();return}if(tag==='TABLE'){flush();lines.push(mdTable(n));return}if(tag==='UL'){flush();[].forEach.call(n.children,function(li){lines.push('- '+mdInline(li).trim())});return}var txt=mdInline(n).trim();if(!txt)return;if(n.classList.contains('kp-sub')){flush();lines.push('#### '+txt);return}if(n.classList.contains('formula')){flush();txt.split('\n').forEach(function(l){lines.push('> '+l)});return}if(n.classList.contains('callout')){flush();txt.split('\n').forEach(function(l){lines.push('> '+l)});return}cur+=mdInline(n)});flush();return lines.join('\n\n')}
function exportMarkdown(){var parts=[];var h1=document.querySelector('header h1');parts.push('# '+(h1?h1.textContent.trim():'考点笔记'));[].forEach.call(document.querySelectorAll('.ch'),function(ch){var ts=ch.querySelector('.ch-title span');var title='';if(ts){var c=ts.cloneNode(true);[].forEach.call(c.querySelectorAll('.badge'),function(b){b.remove()});title=c.textContent.trim()}parts.push('## '+title);var intro=ch.querySelector('.ch-intro');if(intro){var d=mdDetail(intro);if(d)parts.push(d)}[].forEach.call(ch.querySelectorAll('.kp'),function(kp){var num=kp.querySelector('.kp-num'),name=kp.querySelector('.kp-name');var head=((num?num.textContent.trim():'')+' '+(name?name.textContent.trim():'')).trim();parts.push('### '+head);var dt=kp.querySelector('.kp-detail');var dd=dt?mdDetail(dt):'';if(dd)parts.push(dd)})});parts.push('---');parts.push('*导出于 '+new Date().toLocaleString('zh-CN',{hour12:false})+'*');var md=parts.join('\n\n');var blob=new Blob(['\ufeff'+md],{type:'text/markdown;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='@@EXPORT_NAME@@';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);return md}
</script>
